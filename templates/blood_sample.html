<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Sample Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/blood_sample.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-comment-dots"></i>
                <span>VCAN</span>
            </div>
            <nav class="nav">
                <a href="/" class="nav-link">Chat</a>
                <a href="/blood_sample" class="nav-link">Blood Sample</a>
                <a href="/image_detection" class="nav-link">Image</a>
            </nav>
            <div class="auth-buttons">
                <button class="btn-login">Log in</button>
                <button class="btn-signup">Sign up for free</button>
                <button class="btn-help">
                    <i class="fas fa-question-circle"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="chat-container" style="max-width: 1200px;">
            <div class="welcome-section">
                <h1 class="welcome-title">Medical Diagnosis Prediction</h1>
                <p class="subtitle">Enter patient information for accurate diagnosis prediction</p>
                
                <div class="form-container">
                    <form id="bloodSampleForm">
                        <!-- Patient Demographics Section -->
                        <div class="form-section">
                            <h2 class="section-title">Patient Demographics</h2>
                            <div class="form-grid grid-3">
                                <div class="form-group">
                                    <label for="age">
                                        Age <i class="fas fa-info-circle info-icon" title="Patient's age in years"></i>
                                    </label>
                                    <input type="number" id="age" name="age" placeholder="11" required>
                                </div>

                                <div class="form-group">
                                    <label for="gender">Gender</label>
                                    <select id="gender" name="gender" required>
                                        <option value="">Select gender</option>
                                        <option value="0">Male</option>
                                        <option value="1">Female</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="bmi">BMI (Body Mass Index) <span class="range-hint">(18.5-24.9 normal)</span></label>
                                    <input type="number" step="0.01" id="bmi" name="bmi" placeholder="22221" required>
                                </div>
                            </div>
                        </div>

                        <!-- Blood Test Results Section -->
                        <div class="form-section">
                            <h2 class="section-title">Blood Test Results</h2>
                            <div class="form-grid grid-3">
                                <div class="form-group">
                                    <label for="wbc_count">WBC Count (cells/µL) <span class="range-hint">(4,000-11,000)</span></label>
                                    <input type="number" step="0.01" id="wbc_count" name="wbc_count" placeholder="1111" required>
                                </div>

                                <div class="form-group">
                                    <label for="rbc_count">RBC Count (million cells/µL) <span class="range-hint">(4.5-5.5)</span></label>
                                    <input type="number" step="0.01" id="rbc_count" name="rbc_count" placeholder="2222" required>
                                </div>

                                <div class="form-group">
                                    <label for="platelet_count">Platelet Count (cells/µL) <span class="range-hint">(150,000-400,000)</span></label>
                                    <input type="number" step="0.01" id="platelet_count" name="platelet_count" placeholder="222" required>
                                </div>

                                <div class="form-group">
                                    <label for="hemoglobin_level">Hemoglobin Level (g/dL) <span class="range-hint">(12-16)</span></label>
                                    <input type="number" step="0.01" id="hemoglobin_level" name="hemoglobin_level" placeholder="22" required>
                                </div>

                                <div class="form-group">
                                    <label for="bone_marrow_blasts">Bone Marrow Blasts (%) <span class="range-hint">(0-5% normal)</span></label>
                                    <input type="number" step="0.01" id="bone_marrow_blasts" name="bone_marrow_blasts" placeholder="22" required>
                                </div>
                            </div>
                        </div>

                        <!-- Medical History & Risk Factors Section -->
                        <div class="form-section">
                            <h2 class="section-title">Medical History & Risk Factors</h2>
                            <div class="form-grid grid-3">
                                <div class="form-group">
                                    <label for="family_history">Family History</label>
                                    <select id="family_history" name="family_history" required>
                                        <option value="">Select option</option>
                                        <option value="0">No</option>
                                        <option value="1">Yes</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="smoking_status">Smoking Status</label>
                                    <select id="smoking_status" name="smoking_status" required>
                                        <option value="">Select option</option>
                                        <option value="0">Non-smoker</option>
                                        <option value="1">Smoker</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="radiation_exposure">Radiation Exposure</label>
                                    <select id="radiation_exposure" name="radiation_exposure" required>
                                        <option value="">Select option</option>
                                        <option value="0">No</option>
                                        <option value="1">Yes</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="infection_history">Infection History</label>
                                    <select id="infection_history" name="infection_history" required>
                                        <option value="">Select option</option>
                                        <option value="0">No</option>
                                        <option value="1">Yes</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-predict">
                                <i class="fas fa-stethoscope"></i>
                                <span>Predict Diagnosis</span>
                            </button>
                            <button type="reset" class="btn-reset">
                                <i class="fas fa-redo"></i>
                                <span>Reset Form</span>
                            </button>
                        </div>
                    </form>

                    <div id="resultContainer" class="result-container" style="display: none;">
                        <div class="result-card">
                            <h2 class="result-title">Prediction Result</h2>
                            <div id="resultContent" class="result-content"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/blood_sample.js') }}"></script>
</body>
</html>
