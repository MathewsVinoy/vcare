version: '3.8'

services:
  phi3-web-app:
    build: .
    container_name: phi3-cancer-diagnosis
    ports:
      - "5000:5000"
    volumes:
      # Mount model cache to persist downloaded models
      - ./model_cache:/app/model_cache
      - ./phi3_lora_model:/app/phi3_lora_model
      # Optional: mount for development (comment out for production)
      # - ./app.py:/app/app.py
      # - ./templates:/app/templates
      # - ./static:/app/static
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Uncomment if you have NVIDIA GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
